name: Performance (Lighthouse)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse ${{ matrix.theme }} (mobile + desktop, wp-env)
    runs-on: ubuntu-latest
    # NON-BLOCKING until every theme's scores are stable across 3 runs. Then
    # remove continue-on-error, make the matrix a required check, and record
    # anything that truly cannot reach 100 in the ALLOWLIST in .lighthouserc.cjs.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        theme: [basic-theme, advanced-theme, store-theme]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: pnpm install --frozen-lockfile

      - name: Build the Vite plugin (the theme's framework build dependency)
        run: pnpm --filter @stratawp/vite-plugin build

      - name: Prepare the theme (copy core into vendor, build assets)
        working-directory: examples/${{ matrix.theme }}
        env:
          # Copy the path-repo `stratawp/core` into vendor/ instead of
          # symlinking, so it resolves inside the wp-env container.
          COMPOSER_MIRROR_PATH_REPOS: '1'
        run: |
          composer install --no-interaction --no-progress
          pnpm build

      - name: Start WordPress (wp-env)
        run: pnpm exec wp-env start

      # Default content, no extra setup, logged out: the theme as a user gets it.
      - name: Activate the theme
        run: pnpm exec wp-env run cli wp theme activate ${{ matrix.theme }}

      # A normal install turns pretty permalinks on; wp-env stays on plain
      # ones, where WordPress has no rewrite rule for /favicon.ico and the
      # browser logs a 404 that no theme can fix. wp-env also ships no
      # .htaccess, and wp-cli only writes one on a hard flush when it is told
      # mod_rewrite is loaded (it can't detect Apache modules from the CLI).
      - name: Use pretty permalinks
        run: |
          pnpm exec wp-env run cli wp rewrite structure '/%postname%/'
          pnpm exec wp-env run cli bash -c 'printf "apache_modules:\n  - mod_rewrite\n" > wp-cli.yml && wp rewrite flush --hard && rm wp-cli.yml && test -f .htaccess'

      - name: Wait for WordPress to be ready
        run: node scripts/wait-for-http.mjs http://localhost:8888/ 120000

      # Only basic-theme loads the CriticalCss component.
      - name: Extract critical CSS from the rendered page
        if: matrix.theme == 'basic-theme'
        run: node scripts/extract-critical.mjs http://localhost:8888/ examples/basic-theme/dist

      - name: Lighthouse (mobile)
        env:
          STRATAWP_LH_PRESET: mobile
        run: pnpm test:perf

      - name: Lighthouse (desktop)
        if: ${{ !cancelled() }}
        env:
          STRATAWP_LH_PRESET: desktop
        run: pnpm test:perf

      - name: Gap report (job summary)
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-report.mjs --theme ${{ matrix.theme }} --dir lighthouse-reports

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.theme }}
          path: lighthouse-reports
          retention-days: 14
          if-no-files-found: ignore
